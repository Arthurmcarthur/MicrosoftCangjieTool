name: Build

on:
  push:
    tags: ["v*", "[0-9]*"]   # v2.0.0 或 2.0.0 都認
  workflow_dispatch:          # 平時手動觸發試 build，不每次 push 都跑

env:
  PYTHONUTF8: "1"             # runner 主控台預設非 UTF-8，Nuitka / 腳本會印中文

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"
      - run: python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: MSCJTool-windows
          path: build/MSCJTool.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest      # Apple Silicon → 產出 arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"
      - run: python scripts/build_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: MSCJTool-macos
          path: build/MSCJTool-macos.zip
          if-no-files-found: error

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/MSCJTool.exe
          dist/MSCJTool-macos.zip
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes
          --draft
