name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # 平時手動觸發試 build，不每次 push 都跑（Windows runner 很貴）

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # 打 tag 時建 Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[build]"

      - name: Nuitka build
        run: python scripts/build_windows.py

      - uses: actions/upload-artifact@v4
        with:
          name: MSCJTool-exe
          path: build/MSCJTool.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/MSCJTool.exe --title "${{ github.ref_name }}" --generate-notes --draft
